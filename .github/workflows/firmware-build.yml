name: Firmware build

# M0.2 (Refs #2). Evidence classes:
#   layer-detect           -> informational only (not evidence)
#   static-dependency-gate -> Class S (static) only; skipped when layers are absent
#   esp-idf-build          -> Class B (build) only
# A successful build is NOT hardware validation, NOT unit/integration evidence,
# and says nothing about timing, electrical behaviour, safety, or clinical validity.
#   host-unit-tests        -> Class U (host unit) only; Core + Application with mock ports
# Contract fixtures verify tooling separately from product Class U.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Source commit under test: PR head for pull_request events (not the merge commit), else the pushed SHA.
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  layer-detect:
    # Detection only. Not conformance evidence.
    name: Layer detect (informational, not a conformance check)
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.detect.outputs.present }}
      dirs: ${{ steps.detect.outputs.dirs }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect layered components (ADR-0001 section 3.5)
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/layer_contract.py detect > layer-state.txt
          cat layer-state.txt >> "$GITHUB_OUTPUT"
          cat layer-state.txt
          if grep -qx 'present=false' layer-state.txt; then
            echo "### Class S: NOT APPLICABLE (not evidence)" >> "$GITHUB_STEP_SUMMARY"
          fi

  static-dependency-gate:
    name: class-s-dependency-gate
    needs: layer-detect
    # Skipped (not green) when no layered components exist.
    if: needs.layer-detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Forbidden-include gate for layered components
        shell: bash
        # Logic lives in tools/class-s-gate.py via the shell wrapper (Refs #10):
        # exit 0 PASS; 1 FAIL; 3 NOT APPLICABLE. A present hierarchy must return 0.
        run: |
          set -uo pipefail
          rc=0
          bash tools/class-s-gate.sh . 2>&1 | tee violations.txt || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "### Class S dependency gate: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Class S dependency gate::FAIL (gate exit $rc)"
            { echo "### Class S dependency gate: FAIL (gate exit $rc)"; echo '```'; cat violations.txt 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  class-s-gate-selftest:
    # Fixture self-test of the Class S gate script (Refs #10). Verifies the gate, not the code.
    name: class-s-gate-selftest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run gate fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash tools/class-s-gate-selftest.sh 2>&1 | tee gate-selftest.txt
      - name: Run Issue 10 ADR regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/gate-fixtures -p "test_*.py" -v 2>&1 | tee gate-regressions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-regressions-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 90
          path: gate-*.txt

  architecture-contract:
    name: architecture-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Regression-first checks read the exact reviewed helper blob.
      - name: Manifest, workflow and C11 contract regression tests
        run: |
          set -euo pipefail
          {
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python3 --version
            cc --version | head -n1
            cmake --version | head -n1
            ninja --version
          } | tee architecture-tests.txt
          NN2_C11_EVIDENCE_DIR=evidence/reviewed-helper python3 tools/verify_c11_regression.py 2>&1 | tee evidence-regression-first.txt
          NN2_C11_EVIDENCE_DIR=evidence/c11-host python3 -m unittest discover -s tests/architecture -v 2>&1 | tee -a architecture-tests.txt
      - name: Hash contract evidence
        if: always()
        run: |
          mkdir -p evidence
          cp architecture-tests.txt evidence-regression-first.txt evidence/ 2>/dev/null || true
          find evidence -type f ! -name EVIDENCE_SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/EVIDENCE_SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-contract-${{ github.event.pull_request.head.sha || github.sha }}
          include-hidden-files: true # Keep Ninja metadata covered by the checksum inventory.
          retention-days: 90
          if-no-files-found: error
          path: |
            architecture-tests.txt
            evidence/

  esp-idf-build:
    name: class-b-esp-idf-build${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: fake
            suffix: ''
            defaults: sdkconfig.defaults
          - profile: diagnostic
            suffix: '-ads131-diagnostic'
            defaults: sdkconfig.defaults;sdkconfig.ads131-diagnostic
    runs-on: ubuntu-latest
    container:
      # espressif/idf:v6.1, pinned by digest (Docker Hub tag v6.1, verified 2026-10-16).
      image: espressif/idf@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    env:
      EXPECTED_IDF_COMMIT: fff9895c82d744c7237be8847347bdd1b07c6643  # espressif/esp-idf tag v6.1
      SDKCONFIG_DEFAULTS: ${{ matrix.defaults }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record toolchain
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh" > /dev/null
          mkdir -p evidence
          {
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "EVENT=$GITHUB_EVENT_NAME"
            echo "GITHUB_SHA (event ref)=$GITHUB_SHA"
            echo "GITHUB_RUN_ID=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "IDF_PATH=$IDF_PATH"
            echo "idf.py --version: $(idf.py --version)"
            echo "IDF commit: $(git -C "$IDF_PATH" rev-parse HEAD)"
            echo "Compiler: $(xtensa-esp32s3-elf-gcc --version | head -n1)"
            echo "CMake: $(cmake --version | head -n1)"
            echo "Ninja: $(ninja --version)"
            echo "Python: $(python --version 2>&1)"
          } | tee evidence/toolchain.txt
          actual="$(git -C "$IDF_PATH" rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_IDF_COMMIT" ]; then
            echo "FAIL: IDF commit $actual != expected v6.1 commit $EXPECTED_IDF_COMMIT" | tee -a evidence/toolchain.txt
            exit 1
          fi

      - name: Set target and build
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py set-target esp32s3 2>&1 | tee evidence/set-target.log
          idf.py build 2>&1 | tee evidence/build.log
          idf.py size 2>&1 | tee evidence/size.txt
          idf.py size-components 2>&1 | tee evidence/size-components.txt
          python3 tools/check_ads131_config.py --selftest --cc xtensa-esp32s3-elf-gcc --generated-header build/config/sdkconfig.h | tee evidence/config-negatives.txt
          if [ "${{ matrix.profile }}" = diagnostic ]; then
            python3 tools/check_ads131_config.py sdkconfig --diagnostic | tee evidence/profile-config.txt
          else
            python3 tools/check_ads131_config.py sdkconfig | tee evidence/profile-config.txt
          fi
          python3 tools/collect_adc_adapter_build.py --build build --evidence evidence/adapter-dependencies | tee evidence/adapter-dependency-coverage.log
          cp build/flasher_args.json evidence/
          cp build/flash*args evidence/ 2>/dev/null || true
          python3 tools/collect_inner_build.py --build build --evidence evidence/product-dependencies --mode idf 2>&1 | tee evidence/product-dependency-coverage.log

      - name: Verify C11 using the pinned target compiler
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" > /dev/null
          NN2_C11_EVIDENCE_DIR=evidence/c11-target NN2_TEST_CC=xtensa-esp32s3-elf-gcc python3 -m unittest discover -s tests/architecture -p 'test_c11.py' -v 2>&1 | tee evidence/c11-target.txt
          env -u SDKCONFIG_DEFAULTS python3 tools/verify_c11_idf.py 2>&1 | tee evidence/c11-idf-fixture.txt

      - name: Verify generated target
        run: |
          set -euo pipefail
          line="$(grep -E '^CONFIG_IDF_TARGET=' sdkconfig || true)"
          echo "$line" | tee evidence/target.txt
          if [ "$line" != 'CONFIG_IDF_TARGET="esp32s3"' ]; then
            echo "FAIL: CONFIG_IDF_TARGET is not \"esp32s3\""
            exit 1
          fi

      - name: Hash outputs
        run: |
          set -euo pipefail
          cp sdkconfig evidence/sdkconfig
          sha256sum build/*.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin sdkconfig | tee evidence/SHA256SUMS
          python3 tools/reproducible_build.py warnings evidence/build.log --output evidence/warning-count.txt
          find evidence -type f ! -name EVIDENCE_SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/EVIDENCE_SHA256SUMS

      - name: Assemble and validate board-v1 review package
        env:
          PACKAGE_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from firmware_package import create, validate
          profile = os.environ['PACKAGE_PROFILE']
          sha = os.environ['SOURCE_SHA']
          artifact = 'board-v1-package-' + profile + '-' + sha + '-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          ci = {'run_id': int(os.environ['GITHUB_RUN_ID']), 'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
                'event': os.environ['GITHUB_EVENT_NAME'], 'artifact_name': artifact,
                'run_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
                'publication_identity': 'Artifact ID, ZIP digest and expiry assigned after upload; external DOWNLOAD_INDEX binds these without a circular self-hash'}
          output = Path('packages') / ('noctinirs2-board-v1-' + profile + '-' + sha + '.zip')
          create('build', 'evidence', '.', sha, profile, ci, output)
          validate(output, expect_sha=sha, expect_profile=profile, expect_tool=sha)
          (output.parent / 'ZIP_SHA256SUMS').write_text(hashlib.sha256(output.read_bytes()).hexdigest() + '  ' + output.name + '\n')
          print('PASS packaged actual firmware SHA', sha, profile)
          PY

      - name: Upload board-v1 candidate package
        uses: actions/upload-artifact@v4
        with:
          name: board-v1-package-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: packages/

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## Class B build evidence (build only, not hardware validation)"
            echo "Source SHA: $SOURCE_SHA (event: $GITHUB_EVENT_NAME)"
            for f in toolchain.txt target.txt SHA256SUMS size.txt warning-count.txt; do
              [ -f "evidence/$f" ] && { echo "### $f"; echo '```'; cat "evidence/$f"; echo '```'; }
            done
            if [ -f evidence/build.log ]; then
              echo "### build.log (last 60 lines)"; echo '```'; tail -n 60 evidence/build.log; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-b-build-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          include-hidden-files: true # Evidence checksum inventory includes Ninja metadata.
          retention-days: 90
          if-no-files-found: error
          path: |
            evidence/
            build/*.bin
            build/*.elf
            build/*.map
            build/flasher_args.json
            build/flash*args
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin

  packaging-tests:
    name: offline-package-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test generator and offline validator (host tooling, not product Class U)
        shell: bash
        run: |
          set -euo pipefail
          { echo "SOURCE_SHA=$SOURCE_SHA"; date -u +%Y-%m-%dT%H:%M:%SZ; python3 --version; python3 -m unittest discover -s tests/packaging -v; } 2>&1 | tee packaging-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-package-tests-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: packaging-tests.txt

  host-unit-tests:
    # Product Class U: production Core/Application linked with deterministic mocks.
    name: class-u-host-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Exact reviewed control blob for old-fail/new-pass assertions.
      - name: Execute product behavior and isolated failure controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-u
          { echo "SOURCE_SHA=$SOURCE_SHA"; date -u +%Y-%m-%dT%H:%M:%SZ; gcc --version; cmake --version; ninja --version; } > evidence-u/toolchain.txt
          python3 tools/verify_ads131_control_regression.py --evidence evidence-u/control-regression 2>&1 | tee evidence-u/control-regression.log
          python3 tools/run_host_tests.py --build "$RUNNER_TEMP/nn2-host-$GITHUB_RUN_ID" --evidence "$GITHUB_WORKSPACE/evidence-u" --failure-controls 2>&1 | tee evidence-u/runner.log
          python3 tools/collect_inner_build.py --build "$RUNNER_TEMP/nn2-host-$GITHUB_RUN_ID" --evidence evidence-u/product-dependencies --mode host 2>&1 | tee evidence-u/dependency-coverage.log
          python3 tools/collect_adc_adapter_build.py --build "$RUNNER_TEMP/nn2-host-$GITHUB_RUN_ID" --evidence evidence-u/adapter-dependencies | tee evidence-u/adapter-dependency-coverage.log
          python3 tools/layer_contract.py detect | tee evidence-u/layer-state.txt
          python3 tools/class-s-gate.py . 2>&1 | tee evidence-u/real-layer-gate.log
          cat evidence-u/result.json >> "$GITHUB_STEP_SUMMARY"
      - name: Hash product host evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence-u
          find evidence-u -type f ! -name EVIDENCE_SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence-u/EVIDENCE_SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-u-host-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
          path: evidence-u/

  class-s-gate-invariant:
    # Self-check: a present layer must be gated; detection must succeed. Not conformance evidence by itself.
    name: class-s-gate-invariant
    needs: [layer-detect, static-dependency-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Class S gate invariant
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.layer-detect.result }}
          PRESENT: ${{ needs.layer-detect.outputs.present }}
          GATE_RESULT: ${{ needs.static-dependency-gate.result }}
        run: |
          set -euo pipefail
          echo "layer-detect=$DETECT_RESULT present=$PRESENT gate=$GATE_RESULT"
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error title=Class S invariant::layer-detect did not succeed ($DETECT_RESULT)"
            echo "### Class S invariant: FAIL (layer-detect=$DETECT_RESULT)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$PRESENT" = "true" ]; then
            if [ "$GATE_RESULT" != "success" ]; then
              echo "::error title=Class S invariant::layers present but gate result is $GATE_RESULT"
              echo "### Class S invariant: FAIL (layers present, gate=$GATE_RESULT)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "### Class S invariant: OK (layers present, gate=success)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PRESENT" = "false" ] && [ "$GATE_RESULT" = "skipped" ]; then
            echo "### Class S: NOT APPLICABLE (not evidence)" >> "$GITHUB_STEP_SUMMARY"
            echo "Invariant holds: no normative layer paths, gate skipped."
          else
            echo "::error title=Class S invariant::unexpected state present=$PRESENT gate=$GATE_RESULT"
            echo "### Class S invariant: FAIL (present=$PRESENT, gate=$GATE_RESULT)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
