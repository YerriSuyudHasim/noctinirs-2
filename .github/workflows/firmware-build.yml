name: Firmware build

# M0.2 (Refs #2). Evidence classes:
#   layer-detect           -> informational only (not evidence)
#   static-dependency-gate -> Class S (static) only; skipped when layers are absent
#   esp-idf-build          -> Class B (build) only
# A successful build is NOT hardware validation, NOT unit/integration evidence,
# and says nothing about timing, electrical behaviour, safety, or clinical validity.
# Contract fixtures verify tooling; no product Class U suite exists yet.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Source commit under test: PR head for pull_request events (not the merge commit), else the pushed SHA.
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  layer-detect:
    # Detection only. Not conformance evidence.
    name: Layer detect (informational, not a conformance check)
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.detect.outputs.present }}
      dirs: ${{ steps.detect.outputs.dirs }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect layered components (ADR-0001 section 3.5)
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/layer_contract.py detect > layer-state.txt
          cat layer-state.txt >> "$GITHUB_OUTPUT"
          cat layer-state.txt
          if grep -qx 'present=false' layer-state.txt; then
            echo "### Class S: NOT APPLICABLE (not evidence)" >> "$GITHUB_STEP_SUMMARY"
          fi

  static-dependency-gate:
    name: class-s-dependency-gate
    needs: layer-detect
    # Skipped (not green) when no layered components exist.
    if: needs.layer-detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Forbidden-include gate for layered components
        shell: bash
        # Logic lives in tools/class-s-gate.sh (Refs #10): exit 0 PASS; 1 FAIL (violation,
        # empty/missing layer folder, or grep rc>=2 scanner error). Only grep rc=1 (no match) passes.
        run: |
          set -uo pipefail
          rc=0
          VIOLATIONS_FILE=violations.txt bash tools/class-s-gate.sh . || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "### Class S dependency gate: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Class S dependency gate::FAIL (gate exit $rc)"
            { echo "### Class S dependency gate: FAIL (gate exit $rc)"; echo '```'; cat violations.txt 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  class-s-gate-selftest:
    # Fixture self-test of the Class S gate script (Refs #10). Verifies the gate, not the code.
    name: class-s-gate-selftest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run gate fixtures
        shell: bash
        run: bash tools/class-s-gate-selftest.sh

  architecture-contract:
    name: architecture-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Manifest, workflow and C11 contract regression tests
        run: |
          set -euo pipefail
          {
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python3 --version
            cc --version | head -n1
            cmake --version | head -n1
            ninja --version
          } | tee architecture-tests.txt
          python3 -m unittest discover -s tests/architecture -v 2>&1 | tee -a architecture-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-contract-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: architecture-tests.txt

  esp-idf-build:
    name: class-b-esp-idf-build
    runs-on: ubuntu-latest
    container:
      # espressif/idf:v6.1, pinned by digest (Docker Hub tag v6.1, verified 2026-10-16).
      image: espressif/idf@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    env:
      EXPECTED_IDF_COMMIT: fff9895c82d744c7237be8847347bdd1b07c6643  # espressif/esp-idf tag v6.1
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record toolchain
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh" > /dev/null
          mkdir -p evidence
          {
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "EVENT=$GITHUB_EVENT_NAME"
            echo "GITHUB_SHA (event ref)=$GITHUB_SHA"
            echo "GITHUB_RUN_ID=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "IDF_PATH=$IDF_PATH"
            echo "idf.py --version: $(idf.py --version)"
            echo "IDF commit: $(git -C "$IDF_PATH" rev-parse HEAD)"
            echo "Compiler: $(xtensa-esp32s3-elf-gcc --version | head -n1)"
            echo "CMake: $(cmake --version | head -n1)"
            echo "Ninja: $(ninja --version)"
            echo "Python: $(python --version 2>&1)"
          } | tee evidence/toolchain.txt
          actual="$(git -C "$IDF_PATH" rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_IDF_COMMIT" ]; then
            echo "FAIL: IDF commit $actual != expected v6.1 commit $EXPECTED_IDF_COMMIT" | tee -a evidence/toolchain.txt
            exit 1
          fi

      - name: Set target and build
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py set-target esp32s3 2>&1 | tee evidence/set-target.log
          idf.py build 2>&1 | tee evidence/build.log
          idf.py size 2>&1 | tee evidence/size.txt

      - name: Verify C11 using the pinned target compiler
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" > /dev/null
          NN2_TEST_CC=xtensa-esp32s3-elf-gcc python3 -m unittest discover -s tests/architecture -p 'test_c11.py' -v 2>&1 | tee evidence/c11-target.txt
          python3 tools/verify_c11_idf.py 2>&1 | tee evidence/c11-idf-fixture.txt

      - name: Verify generated target
        run: |
          set -euo pipefail
          line="$(grep -E '^CONFIG_IDF_TARGET=' sdkconfig || true)"
          echo "$line" | tee evidence/target.txt
          if [ "$line" != 'CONFIG_IDF_TARGET="esp32s3"' ]; then
            echo "FAIL: CONFIG_IDF_TARGET is not \"esp32s3\""
            exit 1
          fi

      - name: Hash outputs
        run: |
          set -euo pipefail
          cp sdkconfig evidence/sdkconfig
          sha256sum build/*.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin sdkconfig | tee evidence/SHA256SUMS
          grep -ciE 'warning:' evidence/build.log > evidence/warning-count.txt || true
          echo "Compiler warning lines: $(cat evidence/warning-count.txt)"

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## Class B build evidence (build only, not hardware validation)"
            echo "Source SHA: $SOURCE_SHA (event: $GITHUB_EVENT_NAME)"
            for f in toolchain.txt target.txt SHA256SUMS size.txt warning-count.txt; do
              [ -f "evidence/$f" ] && { echo "### $f"; echo '```'; cat "evidence/$f"; echo '```'; }
            done
            if [ -f evidence/build.log ]; then
              echo "### build.log (last 60 lines)"; echo '```'; tail -n 60 evidence/build.log; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-b-build-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            evidence/
            build/*.bin
            build/*.elf
            build/*.map
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin

  class-s-gate-invariant:
    # Self-check: a present layer must be gated; detection must succeed. Not conformance evidence by itself.
    name: class-s-gate-invariant
    needs: [layer-detect, static-dependency-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Class S gate invariant
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.layer-detect.result }}
          PRESENT: ${{ needs.layer-detect.outputs.present }}
          GATE_RESULT: ${{ needs.static-dependency-gate.result }}
        run: |
          set -euo pipefail
          echo "layer-detect=$DETECT_RESULT present=$PRESENT gate=$GATE_RESULT"
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error title=Class S invariant::layer-detect did not succeed ($DETECT_RESULT)"
            echo "### Class S invariant: FAIL (layer-detect=$DETECT_RESULT)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$PRESENT" = "true" ]; then
            if [ "$GATE_RESULT" != "success" ]; then
              echo "::error title=Class S invariant::layers present but gate result is $GATE_RESULT"
              echo "### Class S invariant: FAIL (layers present, gate=$GATE_RESULT)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "### Class S invariant: OK (layers present, gate=success)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PRESENT" = "false" ] && [ "$GATE_RESULT" = "skipped" ]; then
            echo "### Class S: NOT APPLICABLE (not evidence)" >> "$GITHUB_STEP_SUMMARY"
            echo "Invariant holds: no normative layer paths, gate skipped."
          else
            echo "::error title=Class S invariant::unexpected state present=$PRESENT gate=$GATE_RESULT"
            echo "### Class S invariant: FAIL (present=$PRESENT, gate=$GATE_RESULT)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
