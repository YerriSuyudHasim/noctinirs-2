name: Version consistency

# Issue #52. Compares VERSION, PROJECT_VER (the value ESP-IDF writes into
# esp_app_desc.version), project.yaml development_version, NN2_VERSION_STRING,
# and the git tag when this workflow runs on a tag. A missing field fails.
# The self-test job must fail if the mismatch fixture passes or the match
# fixture fails. Evidence class of this workflow is host tooling, not Class H.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  version-consistency:
    name: version-consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compare recorded versions
        run: |
          set -euo pipefail
          python3 tools/check_version_consistency.py --root . | tee version-consistency.txt
          echo "SOURCE_SHA=$SOURCE_SHA" >> version-consistency.txt
          echo "GITHUB_REF_TYPE=${GITHUB_REF_TYPE}" >> version-consistency.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: version-consistency-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: version-consistency.txt

  version-consistency-selftest:
    name: version-consistency-selftest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Mismatch fixture must fail and match fixture must pass
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$SOURCE_SHA" | tee version-selftest.txt
          python3 -m unittest discover -s tests/version-consistency -v 2>&1 | tee -a version-selftest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: version-selftest-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: version-selftest.txt
